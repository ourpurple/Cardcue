version: '3.8'

services:
  # 可选本地开发/单机数据库（若使用外部数据库如 152.70.238.24，默认无需启动此容器）
  # 若需要在 VPS 本地起容器化 PostgreSQL，可通过命令启动: docker compose --profile local-db up -d
  db:
    image: postgres:16-alpine
    container_name: cardcue_db
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardcube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-cardcube}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardcube} -d ${POSTGRES_DB:-cardcube}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cardcue_api
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn cardcue_api.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    env_file:
      - .env
    volumes:
      - mail_data:/app/data/mail_storage

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cardcue_worker
    restart: unless-stopped
    command: python -m cardcue_api.jobs.worker
    env_file:
      - .env
    volumes:
      - mail_data:/app/data/mail_storage
    depends_on:
      api:
        condition: service_started

  scheduler:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cardcue_scheduler
    restart: unless-stopped
    command: python -m cardcue_api.jobs.scheduler
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: cardcue_web
    restart: unless-stopped
    ports:
      # 映射到宿主机 127.0.0.1:3000，供宿主机 Nginx / Caddy 反代并加载 HTTPS 证书
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  mail_data:
