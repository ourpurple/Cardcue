[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardcue-backend"
version = "0.1.0"
description = "CardCue statement parsing service skeleton"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0", "pydantic>=2.9,<3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["cardcue_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
